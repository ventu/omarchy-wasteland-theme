# Wasteland theme extras. Each one is on only while Wasteland is the current
# theme. These are the defaults; install.sh copies this file to
# ~/.config/omarchy/wasteland/features.conf, and that copy is the one to edit
# (it survives `omarchy theme update`). Set a line to 0 to keep that extra
# off even with Wasteland, then apply it:
#
#   omarchy theme set wasteland
#
# BOOT          Wrist-terminal boot animation after login
# LOCK_VIEW     Pip-Boy lock screen (0 = Omarchy-style lock, no blur)
# CRT           Tube-TV power-off/on: lock, unlock, login, shutdown, reboot
# SCREENSAVER   Overseer terminal screensaver (typed logs + radiation trefoil)
# BAR_TABS      Workspaces 1-5 shown as STAT INV DATA MAP RADIO tabs
# STATUS_STRIP  Rust line under the bar, trefoil menu button, 15.NOV.2026 13:37 clock
# TAB_LABELS    Names of the bar tabs for workspaces 1, 2, 3... (with BAR_TABS=1).
#               Comma-separated, up to 10. Workspaces past the list, or left
#               empty (A,,C), show their number. Blank = STAT,INV,DATA,MAP,RADIO
BOOT=1
LOCK_VIEW=1
CRT=1
SCREENSAVER=1
BAR_TABS=1
STATUS_STRIP=1
TAB_LABELS=STAT,INV,DATA,MAP,RADIO
